name: Automated Postman API Tests via Newman

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  api-testing:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy code từ repository về
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Cài đặt Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. Cài đặt Newman và Newman Reporter HTMLExtra
      - name: Install Newman & Reporters
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      # 4. Chạy Postman Collection với Environment và file CSV Data
      - name: Run Postman Tests
        run: |
          newman run 2474802010094_PhanTuanEm_ReqRes.postman_collection.json \
            -e 2474802010094_PhanTuanEm_ReqRes_Env.postman_environment.json \
            -d users.csv \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman/report.html

      # 5. Lưu báo cáo kết quả HTML dưới dạng Artifact
      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-html-report
          path: newman/report.html
